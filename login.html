<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | مبادرة معًا نتعلم الأزهرية</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <button class="back-btn" onclick="location.href='index.html'">
                    <i class="fas fa-arrow-right"></i>
                </button>
                <h2>تسجيل الدخول</h2>
                <p>أدخل بياناتك للوصول إلى حسابك</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="studentCode">
                        <i class="fas fa-id-card"></i>
                        كود الطالب
                    </label>
                    <input type="text" id="studentCode" name="studentCode" required
                           placeholder="أدخل كود الطالب الخاص بك">
                    <span class="error-message" id="studentCodeError"></span>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        كلمة المرور
                    </label>
                    <input type="password" id="password" name="password" required
                           placeholder="أدخل كلمة المرور">
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    تسجيل الدخول
                </button>
            </form>

            <div class="auth-footer">
                <p>ليس لديك حساب؟ <a href="register.html">تسجيل طالب جديد</a></p>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
