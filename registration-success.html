<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم التسجيل بنجاح | مبادرة معًا نتعلم الأزهرية</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
            padding: 2rem;
        }
        
        .success-card {
            background: var(--bg-secondary);
            padding: 3rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: slideInUp 0.6s ease;
        }
        
        .success-icon {
            font-size: 5rem;
            color: var(--success);
            margin-bottom: 1.5rem;
            animation: bounce 1s ease infinite;
        }
        
        .success-title {
            font-size: var(--font-3xl);
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        
        .student-code-display {
            background: var(--bg-accent);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            margin: 2rem 0;
            border: 3px dashed var(--accent-color);
        }
        
        .student-code-display label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-size: var(--font-lg);
        }
        
        .student-code-display .code {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            letter-spacing: 2px;
        }
        
        .student-info-summary {
            text-align: right;
            margin: 2rem 0;
            padding: 1.5rem;
            background: var(--bg-primary);
            border-radius: var(--radius-md);
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--text-light);
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: bold;
            color: var(--text-secondary);
        }
        
        .info-value {
            color: var(--text-primary);
        }
        
        .warning-message {
            background: #fff3cd;
            color: #856404;
            padding: 1rem;
            border-radius: var(--radius-md);
            margin: 1.5rem 0;
            border: 1px solid #ffeeba;
        }
        
        [data-theme="dark"] .warning-message {
            background: #3a3a1a;
            color: #ffd700;
            border-color: #4a4a2a;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        @media (max-width: 768px) {
            .success-card {
                padding: 2rem;
            }
            
            .student-code-display .code {
                font-size: 1.8rem;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="success-page">
        <div class="success-card glass-card">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            
            <h1 class="success-title">تم إنشاء حسابك بنجاح 🎉</h1>
            
            <div id="studentInfoContainer">
                <!-- Student information will be displayed here -->
            </div>
            
            <div class="student-code-display">
                <label>كود الطالب الخاص بك</label>
                <div class="code" id="studentCodeDisplay">------</div>
            </div>
            
            <div class="warning-message">
                <i class="fas fa-exclamation-triangle"></i>
                <strong>هام:</strong> احتفظ بكود الطالب جيدًا، فهذا الكود هو وسيلة تسجيل دخولك إلى المنصة ودخول المسابقات والامتحانات.
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-primary btn-lg" onclick="copyStudentCode()">
                    <i class="fas fa-copy"></i>
                    نسخ الكود
                </button>
                <button class="btn btn-outline btn-lg" onclick="printAccountData()">
                    <i class="fas fa-print"></i>
                    طباعة بيانات الحساب
                </button>
                <button class="btn btn-success btn-lg" onclick="location.href='login.html'">
                    <i class="fas fa-sign-in-alt"></i>
                    الذهاب لتسجيل الدخول
                </button>
            </div>
        </div>
    </div>
    
    <div id="toastContainer" class="toast-container"></div>
    
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Load registration data from session storage
        document.addEventListener('DOMContentLoaded', function() {
            const registrationData = sessionStorage.getItem('lastRegistration');
            
            if (registrationData) {
                const studentData = JSON.parse(registrationData);
                displayStudentInfo(studentData);
            } else {
                // Redirect to registration page if no data
                window.location.href = 'register.html';
            }
        });
        
        function displayStudentInfo(student) {
            const container = document.getElementById('studentInfoContainer');
            const codeDisplay = document.getElementById('studentCodeDisplay');
            
            // Display student code
            codeDisplay.textContent = student.studentCode;
            
            // Display student information
            container.innerHTML = `
                <div class="student-info-summary">
                    <div class="info-row">
                        <span class="info-label">اسم الطالب:</span>
                        <span class="info-value">${student.fullName}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">الصف:</span>
                        <span class="info-value">${getGradeName(student.grade)}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">المعهد:</span>
                        <span class="info-value">${student.institute}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">المنطقة الأزهرية:</span>
                        <span class="info-value">${student.azharRegion}</span>
                    </div>
                </div>
            `;
        }
        
        function copyStudentCode() {
            const codeDisplay = document.getElementById('studentCodeDisplay');
            const code = codeDisplay.textContent;
            
            navigator.clipboard.writeText(code).then(() => {
                showToast('تم نسخ الكود بنجاح', 'success');
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = code;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                textArea.remove();
                showToast('تم نسخ الكود بنجاح', 'success');
            });
        }
        
        function printAccountData() {
            window.print();
        }
    </script>
</body>
</html>
